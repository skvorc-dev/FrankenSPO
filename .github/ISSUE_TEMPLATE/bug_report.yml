name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: input
    id: dotnet-sdk
    attributes:
      label: ".NET SDK version (`dotnet --version`)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - other
    validations:
      required: true
  - type: input
    id: database-provider
    attributes:
      label: Database provider and version
      description: For example SQLite and the Microsoft.Data.Sqlite version. Optional.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and environment
      description: Include provider, runtime, relevant version, minimal reproduction; redact secrets.
    validations:
      required: true
